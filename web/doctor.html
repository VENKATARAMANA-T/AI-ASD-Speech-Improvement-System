<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tamil Tutor · Doctor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- design tokens ---------- */
  :root {
    color-scheme: light;
    --bg: #f3f6fb;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-2: #f1f4fa;
    --border: #e2e7f3;
    --text: #17203a;
    --muted: #66708f;
    --brand: #2f6bff;
    --brand-2: #14b8a6;
    --ok: #16a34a;
    --warn: #f59e0b;
    --bad: #e11d48;
    --c-vowels: #ff8a65;
    --c-words: #26c6da;
    --c-sentences: #ffc107;
    --c-long_sentences: #9575cd;
    --shadow: 0 10px 30px rgba(30,50,120,.08);
    --r: 18px;
    --r-sm: 12px;
    --sidebar: 250px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1424;
    --bg-2: #151b30;
    --panel: #1b2240;
    --panel-2: #222b52;
    --border: #2c3663;
    --text: #eef1ff;
    --muted: #9aa5cc;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .tam { font-family: "Noto Sans Tamil", "Nirmala UI", "Latha", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .hidden { display: none !important; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 22px 14px; display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
    font-weight: 900; font-size: 22px; box-shadow: 0 6px 18px rgba(47,107,255,.35);
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 900; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px;
    font-weight: 800; color: var(--muted); transition: background .15s, color .15s, transform .1s;
  }
  .nav a .ic { font-size: 19px; width: 26px; text-align: center; }
  .nav a:hover { background: var(--panel-2); color: var(--text); transform: translateX(2px); }
  .nav a.active { background: linear-gradient(135deg, rgba(47,107,255,.16), rgba(20,184,166,.14)); color: var(--text); }
  .badge { margin-left: auto; background: var(--brand); color: #fff; font-size: 11px; font-weight: 900; border-radius: 999px; padding: 2px 8px; min-width: 20px; text-align: center; }
  .sidebar .spacer { flex: 1; }
  .me { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; }
  .me .who { flex: 1; min-width: 0; }
  .me b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me small { color: var(--muted); font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .me button { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px; border-radius: 8px; }
  .me button:hover { background: var(--panel); color: var(--bad); }

  .main { padding: 26px 34px 60px; max-width: 1240px; width: 100%; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 800; font-size: 14px; flex-wrap: wrap; }
  .crumbs a:hover { color: var(--text); }
  .crumbs .sep { opacity: .5; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-weight: 800; display: inline-flex; gap: 8px; align-items: center;
  }
  h2.title { font-size: 28px; margin: 0 0 4px; font-weight: 900; letter-spacing: -.02em; }
  p.lead { margin: 0 0 22px; color: var(--muted); font-weight: 700; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .head p.lead { margin-bottom: 0; }

  /* ---------- cards ---------- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; position: relative; }
  .grid { display: grid; gap: 16px; }
  .grid.students { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .grid.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 22px; }
  .grid.cats { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .grid.items { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .grid.items.wide { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .grid.two { grid-template-columns: 1.2fr .8fr; align-items: start; }
  @media (max-width: 980px) { .grid.two { grid-template-columns: 1fr; } }
  .kpi .n { font-size: 32px; font-weight: 900; line-height: 1.1; }
  .kpi .l { color: var(--muted); font-weight: 800; font-size: 13px; }
  .kpi .n small { font-size: 16px; color: var(--muted); }

  .btn {
    border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 900; font-size: 14px;
    display: inline-flex; align-items: center; gap: 8px; transition: transform .1s, filter .15s, opacity .15s;
    color: #fff; background: var(--brand);
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.alt { background: transparent; color: var(--text); border: 2px solid var(--border); }
  .btn.danger { background: var(--bad); }
  .btn.ghost-danger { background: transparent; color: var(--bad); border: 2px solid rgba(225,29,72,.35); }
  .btn.ok { background: var(--ok); }
  .btn.sm { padding: 7px 14px; font-size: 13px; }
  .btn.big { padding: 14px 26px; font-size: 16px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .pill.ok { background: rgba(22,163,74,.12); color: var(--ok); border-color: rgba(22,163,74,.3); }
  .pill.warn { background: rgba(245,158,11,.14); color: #b45309; border-color: rgba(245,158,11,.35); }
  [data-theme="dark"] .pill.warn { color: #fbbf24; }
  .pill.bad { background: rgba(225,29,72,.12); color: var(--bad); border-color: rgba(225,29,72,.3); }
  .pill.brand { background: rgba(47,107,255,.12); color: var(--brand); border-color: rgba(47,107,255,.3); }

  /* ---------- avatar ---------- */
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #fff; flex: none; background: var(--av, var(--brand)); border: 3px solid var(--panel); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .avatar.lg { width: 110px; height: 110px; font-size: 38px; }
  .avatar.sm { width: 34px; height: 34px; font-size: 13px; border-width: 2px; }
  .avatar img, img.avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  /* ---------- student card ---------- */
  .student { cursor: pointer; transition: transform .15s, box-shadow .15s; padding: 0; overflow: hidden; }
  .student:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(30,50,120,.16); }
  .student .top { height: 64px; background: linear-gradient(135deg, var(--av, var(--brand)), var(--brand-2)); opacity: .9; }
  .student .body { padding: 0 18px 18px; margin-top: -34px; }
  .student h3 { margin: 8px 0 2px; font-size: 18px; font-weight: 900; }
  .student .meta { color: var(--muted); font-weight: 700; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .student .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .student .del { position: absolute; top: 10px; right: 10px; border: 0; background: rgba(255,255,255,.85); color: var(--bad); border-radius: 999px; width: 32px; height: 32px; font-size: 15px; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
  .student:hover .del { opacity: 1; }
  .ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 900; flex: none;
          background: conic-gradient(var(--c, var(--brand)) calc(var(--p) * 1%), var(--panel-2) 0); }
  .ring span { width: 36px; height: 36px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; }
  .add-card { border: 2px dashed var(--border); background: transparent; box-shadow: none; display: grid; place-items: center; min-height: 220px; text-align: center; color: var(--muted); font-weight: 800; cursor: pointer; transition: border-color .15s, color .15s; }
  .add-card:hover { border-color: var(--brand); color: var(--brand); }
  .add-card .plus { font-size: 40px; line-height: 1; }

  /* ---------- forms ---------- */
  .form { display: grid; gap: 12px; }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .form .row { grid-template-columns: 1fr; } }
  label.f { display: grid; gap: 5px; font-weight: 800; font-size: 13px; color: var(--muted); }
  .in { width: 100%; border: 2px solid var(--border); background: var(--bg-2); border-radius: 12px; padding: 10px 13px; font-weight: 700; outline: none; transition: border-color .15s; }
  .in:focus { border-color: var(--brand); }
  textarea.in { min-height: 70px; resize: vertical; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-weight: 900; font-size: 13px; }
  .seg button.active { background: var(--brand); color: #fff; }
  .photo-pick { display: flex; align-items: center; gap: 14px; }
  .photo-pick .avatar { cursor: pointer; }
  .err { display: none; border: 2px solid var(--bad); background: rgba(225,29,72,.1); color: var(--bad); padding: 10px 14px; border-radius: var(--r-sm); font-weight: 800; margin-bottom: 14px; }
  .err.show { display: block; }
  .note { border: 1px solid var(--border); background: var(--panel-2); border-radius: var(--r-sm); padding: 12px 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .note b { color: var(--text); }
  .link-box { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .link-box input { flex: 1; font-size: 12.5px; }

  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,15,40,.55); display: none; place-items: center; z-index: 60; padding: 20px; backdrop-filter: blur(3px); }
  .modal-bg.show { display: grid; }
  .modal { width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; animation: pop .25s ease-out; }
  .modal h3 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
  .modal .sub { color: var(--muted); font-weight: 700; margin: 0 0 16px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(1200px 600px at 10% -10%, rgba(47,107,255,.18), transparent), radial-gradient(900px 500px at 100% 100%, rgba(20,184,166,.16), transparent), var(--bg); }
  .login { width: 100%; max-width: 420px; padding: 34px 30px; }
  .login .logo { width: 56px; height: 56px; font-size: 28px; border-radius: 18px; margin-bottom: 14px; }
  .login h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
  .login p { margin: 0 0 20px; color: var(--muted); font-weight: 700; }

  /* ---------- detail ---------- */
  .profile { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .profile .info { flex: 1; min-width: 240px; }
  .profile h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
  .profile .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 18px; margin-top: 12px; font-weight: 700; font-size: 14px; }
  .profile .facts span { color: var(--muted); font-size: 12px; display: block; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .profile .side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .cat { padding: 18px; overflow: hidden; }
  .cat::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--c); }
  .cat h3 { margin: 6px 0 0; font-size: 17px; font-weight: 900; }
  .cat .sub { color: var(--muted); font-weight: 700; font-size: 12.5px; }
  .cat .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .tile { text-align: center; padding: 12px 8px 10px; border: 2px solid var(--border); border-radius: 14px; background: var(--panel); position: relative; }
  .tile .big { font-size: 26px; line-height: 1.25; font-weight: 700; }
  .tile.wide .big { font-size: 15px; line-height: 1.45; }
  .tile .rom { color: var(--muted); font-weight: 800; font-size: 12px; margin-top: 2px; }
  .tile .n { color: var(--muted); font-weight: 800; font-size: 11px; margin-top: 4px; }
  .tile.deep { border-color: var(--bad); border-style: dashed; }
  .tile .lock { position: absolute; top: 6px; right: 6px; font-size: 12px; }
  .tile.mastered { border-color: rgba(22,163,74,.45); }
  .stars { margin-top: 6px; letter-spacing: 1px; font-size: 13px; }
  .stars .on { color: var(--warn); }
  .stars .off { opacity: .22; }
  .section { margin-top: 26px; }
  .section h3 { margin: 0 0 12px; font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-weight: 700; }
  .li:last-child { border-bottom: 0; }
  .li .t { font-size: 20px; min-width: 90px; }
  .li .muted { color: var(--muted); font-size: 13px; font-weight: 700; }
  .li .r { margin-left: auto; text-align: right; }
  .empty { color: var(--muted); font-weight: 700; font-style: italic; padding: 10px 0; }

  /* ---------- tasks ---------- */
  .task { padding: 18px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
  @media (max-width: 760px) { .task { grid-template-columns: 1fr; } }
  .task .word { font-size: 30px; line-height: 1.3; font-weight: 700; }
  .task .word.long { font-size: 21px; }
  .task .kind { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .task .rom { color: var(--muted); font-weight: 800; }
  .task .due { font-weight: 800; color: var(--muted); font-size: 13px; }
  .task .due b { color: var(--text); font-variant-numeric: tabular-nums; }
  .task .due b.soon { color: var(--bad); }
  .track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
  .track i { display: block; height: 100%; background: var(--ok); border-radius: 5px; transition: width .4s; }
  .who { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .who .pill { padding: 2px 8px 2px 2px; gap: 6px; }
  .task .side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tabs { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 999px; font-weight: 900; }
  .tabs button.active { background: var(--brand); color: #fff; }
  .preview { text-align: center; padding: 18px; border: 2px dashed var(--border); border-radius: var(--r-sm); background: var(--panel-2); }
  .preview .word { font-size: 34px; font-weight: 700; line-height: 1.3; }
  .preview .rom { color: var(--muted); font-weight: 800; }

  /* ---------- video lessons ---------- */
  .grid.videos { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .vcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .vthumb { position: relative; aspect-ratio: 16 / 9; background: #0b1020; cursor: pointer; display: grid; place-items: center; }
  .vthumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .vthumb .play { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.92); color: #17203a; display: grid; place-items: center; font-size: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: transform .15s; padding-left: 4px; }
  .vthumb:hover .play { transform: scale(1.1); }
  .vthumb .dur { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .vcard .vbody { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .vcard h3 { margin: 0; font-size: 17px; font-weight: 900; line-height: 1.3; }
  .vcard .desc { color: var(--muted); font-weight: 700; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vcard .meta { color: var(--muted); font-weight: 800; font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .vcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; }
  .drop { border: 2px dashed var(--border); border-radius: var(--r-sm); padding: 22px; text-align: center; color: var(--muted); font-weight: 800; cursor: pointer; transition: border-color .15s, background .15s; background: var(--panel-2); }
  .drop:hover, .drop.over { border-color: var(--brand); color: var(--brand); background: rgba(47,107,255,.06); }
  .drop .big { font-size: 34px; line-height: 1; margin-bottom: 6px; }
  .drop.has { border-style: solid; border-color: var(--ok); color: var(--text); }
  .upbar { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .upbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .2s; }
  .player-bg { position: fixed; inset: 0; background: rgba(5,8,20,.92); z-index: 70; display: none; flex-direction: column; padding: 18px 22px; backdrop-filter: blur(4px); }
  .player-bg.show { display: flex; }
  .player-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; color: #fff; margin-bottom: 12px; }
  .player-top h3 { margin: 0; font-size: 20px; font-weight: 900; }
  .player-top p { margin: 2px 0 0; color: rgba(255,255,255,.7); font-weight: 700; font-size: 13.5px; }
  .player-top button { border: 0; background: rgba(255,255,255,.12); color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; flex: none; }
  .player-top button:hover { background: rgba(255,255,255,.25); }
  .player-bg video { flex: 1; min-height: 0; width: 100%; max-height: calc(100vh - 100px); background: #000; border-radius: 14px; outline: none; }

  /* ---------- toast ---------- */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 800; opacity: 0; transition: opacity .2s, transform .2s; z-index: 80; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--bad); color: #fff; }
  .toast.ok { background: var(--ok); color: #fff; }

  /* ---------- mobile ---------- */
  .menu-btn { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 40; left: 0; top: 0; width: var(--sidebar); transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.5); }
    .menu-btn { display: inline-flex; }
    .main { padding: 18px 16px 60px; }
  }
</style>
</head>
<body>
<div class="app hidden" id="appView">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo tam">த</div>
      <div><h1>Doctor Portal</h1><small>Tamil Tutor</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard"><span class="ic">📊</span> Dashboard</a>
      <a href="#/students" data-route="students"><span class="ic">🧒</span> Students <span class="badge hidden" id="studentsBadge">0</span></a>
      <a href="#/tasks" data-route="tasks"><span class="ic">📅</span> Today's Task <span class="badge hidden" id="tasksBadge">0</span></a>
      <a href="#/videos" data-route="videos"><span class="ic">🎬</span> Video Lessons</a>
      <a href="#/settings" data-route="settings"><span class="ic">⚙️</span> Settings</a>
    </nav>
    <div class="spacer"></div>
    <div class="me">
      <div class="avatar sm" id="meAvatar">D</div>
      <div class="who"><b id="meName">…</b><small id="meEmail"></small></div>
      <button id="logoutBtn" title="Sign out">⏻</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark">☀️ <span>Light</span></button>
    </div>
    <div class="err" id="err"></div>
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="card modal" id="modal"></div></div>
<div class="player-bg" id="playerBg">
  <div class="player-top"><div><h3 id="plTitle"></h3><p id="plSub"></p></div><button id="plClose" title="Close (Esc)">✕</button></div>
  <video id="plVideo" controls playsinline></video>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const CATS = {
    vowels:         { name: "Vowels",          short: "Vowel",          level: "",       emoji: "🔤", color: "var(--c-vowels)",          wide: false, sub: "The 12 sounds every word is built on" },
    words:          { name: "Words",           short: "Word",           level: "easy",   emoji: "🧩", color: "var(--c-words)",           wide: false, sub: "Family, body and everyday things" },
    sentences:      { name: "Short Sentences", short: "Short sentence", level: "medium", emoji: "💬", color: "var(--c-sentences)",       wide: true,  sub: "Two or three words at a time" },
    long_sentences: { name: "Sentences",       short: "Sentence",       level: "hard",   emoji: "📖", color: "var(--c-long_sentences)",  wide: true,  sub: "Four or five words — full thoughts" },
  };
  const CAT_ORDER = ["vowels", "words", "sentences", "long_sentences"];
  const LEVELS = { easy: { name: "Easy", cls: "ok", emoji: "🟢" }, medium: { name: "Medium", cls: "warn", emoji: "🟡" }, hard: { name: "Hard", cls: "bad", emoji: "🔴" } };
  const levelPill = (lv, extra = "") => LEVELS[lv] ? `<span class="pill ${LEVELS[lv].cls} ${extra}">${LEVELS[lv].emoji} ${LEVELS[lv].name}</span>` : "";
  const VERDICT = { correct: { face: "🌟", label: "Perfect" }, close: { face: "😊", label: "Almost there" }, incorrect: { face: "🤔", label: "Not quite" }, no_speech: { face: "🤫", label: "Nothing heard" } };

  /* =========================================================
     auth + api
     ========================================================= */
  const TOKEN_KEY = "tamiltutor.doctor.token";   // set by the shared sign-in page (/#/login/doctor)
  let token = null, me = null, lexicon = null, byId = {}, serverOffset = 0;
  try { token = localStorage.getItem(TOKEN_KEY); } catch {}

  async function api(path, { method = "GET", json, form, auth = true } = {}) {
    const headers = {};
    if (auth && token) headers.Authorization = "Bearer " + token;
    let body;
    if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
    else if (form) body = form;
    const res = await fetch(path, { method, headers, body });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && auth) { signOut(false); throw new Error(data.detail || "Please sign in again."); }
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || `Request failed (${res.status})`));
    return data;
  }
  function setToken(t) { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }
  function signOut(callServer = true) {
    if (callServer && token) api("/api/auth/logout", { method: "POST" }).catch(() => {});
    setToken(null); me = null;
    showLogin();
  }
  // Sign-in lives on the main page, with the role picker; only a doctor token opens this one.
  function showLogin() { location.replace("/#/login/doctor"); }
  function showApp() { $("appView").classList.remove("hidden"); }

  // A key still held down from the sign-in form can land on this page; ignore a "click" that early.
  $("logoutBtn").onclick = () => { if (performance.now() > 1000) signOut(); };

  /* =========================================================
     theme, toast, modal
     ========================================================= */
  const TKEY = "doctorportal.theme";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").innerHTML = t === "dark" ? "🌙 <span>Dark</span>" : "☀️ <span>Light</span>";
    try { localStorage.setItem(TKEY, t); } catch {}
  }
  $("themeBtn").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  try { applyTheme(localStorage.getItem(TKEY) || "light"); } catch { applyTheme("light"); }
  $("menuBtn").onclick = () => $("sidebar").classList.toggle("open");
  document.addEventListener("click", (e) => { if (window.innerWidth <= 820 && !$("sidebar").contains(e.target) && e.target !== $("menuBtn")) $("sidebar").classList.remove("open"); });

  let toastTimer = 0;
  function toast(msg, cls = "") { const t = $("toast"); t.textContent = msg; t.className = "toast show " + cls; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
  function showError(msg) { $("err").textContent = msg; $("err").classList.add("show"); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function hideError() { $("err").classList.remove("show"); }

  function openModal(html) { $("modal").innerHTML = html; $("modalBg").classList.add("show"); }
  function closeModal() { $("modalBg").classList.remove("show"); $("modal").innerHTML = ""; }
  $("modalBg").onclick = (e) => { if (e.target === $("modalBg")) closeModal(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closePlayer(); } });
  function confirmModal({ title, body, okLabel = "Delete", danger = true }) {
    return new Promise((resolve) => {
      openModal(`<h3>${esc(title)}</h3><p class="sub">${body}</p>
        <div class="actions"><button class="btn alt" id="mCancel">Cancel</button><button class="btn ${danger ? "danger" : ""}" id="mOk">${esc(okLabel)}</button></div>`);
      $("mCancel").onclick = () => { closeModal(); resolve(false); };
      $("mOk").onclick = () => { closeModal(); resolve(true); };
    });
  }

  /* =========================================================
     helpers
     ========================================================= */
  const AV_COLORS = ["#2f6bff", "#14b8a6", "#f97316", "#a855f7", "#e11d48", "#0ea5e9", "#84cc16", "#f59e0b"];
  function avColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
  function initials(s) { return (s.first_name?.[0] || "") + (s.last_name?.[0] || ""); }
  function avatar(s, cls = "") {
    const name = s.name || `${s.first_name} ${s.last_name}`;
    return s.photo_url ? `<img class="avatar ${cls}" src="${esc(s.photo_url)}" alt="" />`
                       : `<div class="avatar ${cls}" style="--av:${avColor(name)}">${esc(initials(s).toUpperCase() || "?")}</div>`;
  }
  function starHtml(n) { return `<div class="stars">` + [1, 2, 3].map((i) => `<span class="${i <= n ? "on" : "off"}">★</span>`).join("") + `</div>`; }
  const genderLabel = (g) => ({ male: "Boy", female: "Girl", other: "Other" }[g] || g);
  const genderIcon = (g) => ({ male: "👦", female: "👧", other: "🧒" }[g] || "🧒");
  function now() { return Date.now() + serverOffset; }
  function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
  function fmtAgo(iso) {
    if (!iso) return "never"; const s = Math.max(0, (now() - new Date(iso)) / 1000);
    if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`; return `${Math.floor(s / 86400)} d ago`;
  }
  function timeLeft(iso) {
    const ms = new Date(iso) - now(); if (ms <= 0) return { text: "time's up", soon: true, over: true };
    const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    const text = h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h left` : h ? `${h}h ${String(m).padStart(2, "0")}m left` : `${m}:${String(s).padStart(2, "0")} left`;
    return { text, soon: ms < 3600000, over: false };
  }
  function fmtDur(sec) { if (!sec || sec <= 0) return ""; sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + `:${String(s).padStart(2, "0")}`; }
  function fmtSize(b) { return b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : b >= 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} KB`; }
  const videoSrc = (v) => `${v.url}?t=${encodeURIComponent(token)}`;
  // Multipart upload with a progress callback; fetch() cannot report upload progress.
  function upload(path, form, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest(); xhr.open("POST", path);
      xhr.setRequestHeader("Authorization", "Bearer " + token);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      xhr.onerror = () => reject(new Error("Upload failed — check the connection and try again."));
      xhr.onload = () => {
        let data = {}; try { data = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 401) { signOut(false); return reject(new Error("Please sign in again.")); }
        if (xhr.status >= 200 && xhr.status < 300) return resolve(data);
        reject(new Error(typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || `Upload failed (${xhr.status})`)));
      };
      xhr.send(form);
    });
  }
  // Length of a local video file, read by the browser so the server needs no ffprobe.
  function probeDuration(file) {
    return new Promise((resolve) => {
      const v = document.createElement("video"); v.preload = "metadata"; const url = URL.createObjectURL(file);
      const done = (d) => { URL.revokeObjectURL(url); resolve(d); };
      v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : null); v.onerror = () => done(null);
      setTimeout(() => done(null), 8000); v.src = url;
    });
  }
  function openPlayer(v) {
    $("plTitle").textContent = v.title; $("plSub").textContent = v.description || `${fmtDur(v.duration) || ""}${v.duration ? " · " : ""}${fmtSize(v.size_bytes)}`;
    const el = $("plVideo"); el.src = videoSrc(v); $("playerBg").classList.add("show"); document.body.style.overflow = "hidden";
    el.play().catch(() => {});
  }
  function closePlayer() {
    if (!$("playerBg").classList.contains("show")) return;
    const el = $("plVideo"); el.pause(); el.removeAttribute("src"); el.load();
    $("playerBg").classList.remove("show"); document.body.style.overflow = "";
  }
  $("plClose").onclick = closePlayer;
  $("playerBg").onclick = (e) => { if (e.target === $("playerBg")) closePlayer(); };
  function setCrumbs(list) { $("crumbs").innerHTML = list.map((c, i) => (i ? `<span class="sep">›</span>` : "") + (c.href ? `<a href="${c.href}">${esc(c.label)}</a>` : `<span>${esc(c.label)}</span>`)).join(""); }
  function setActiveNav(page) { for (const a of document.querySelectorAll("#nav a")) a.classList.toggle("active", a.dataset.route === page); }

  /* =========================================================
     boot + router
     ========================================================= */
  async function boot() {
    if (!token) return showLogin();
    try {
      const r = await api("/api/doctor/me");
      me = r.doctor; serverOffset = new Date(r.now) - Date.now();
      $("meName").textContent = me.name; $("meEmail").textContent = me.email; $("meAvatar").textContent = (me.name.replace(/^dr\.?\s*/i, "")[0] || "D").toUpperCase();
      if (!lexicon) { lexicon = await api("/api/lexicon"); byId = {}; for (const k of CAT_ORDER) for (const e of lexicon[k] || []) byId[e.id] = e; }
      showApp();
      if (!location.hash || location.hash === "#/") location.hash = "#/dashboard";
      await render();
    } catch (err) { if (token) showError(err.message); else showLogin(); }
  }
  function route() { const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean); return { page: parts[0] || "dashboard", a: parts[1] }; }
  window.addEventListener("hashchange", () => { if (me) render(); });
  let tickTimer = 0;
  async function render() {
    hideError(); closeModal(); closePlayer(); clearInterval(tickTimer); $("sidebar").classList.remove("open");
    const r = route(); setActiveNav(r.page);
    const views = { dashboard: viewDashboard, students: viewStudents, tasks: viewTasks, videos: viewVideos, settings: viewSettings };
    try { await (views[r.page] || viewDashboard)(r); } catch (err) { showError(err.message || "Something went wrong."); }
    window.scrollTo({ top: 0 });
  }
  function updateBadges(students, tasksOpen) {
    if (students != null) { const p = students.filter((s) => s.status === "pending").length; $("studentsBadge").textContent = p; $("studentsBadge").classList.toggle("hidden", !p); $("studentsBadge").title = `${p} invite${p === 1 ? "" : "s"} pending`; }
    if (tasksOpen != null) { $("tasksBadge").textContent = tasksOpen; $("tasksBadge").classList.toggle("hidden", !tasksOpen); }
  }

  /* =========================================================
     dashboard
     ========================================================= */
  async function viewDashboard() {
    setCrumbs([{ label: "Dashboard" }]);
    $("view").innerHTML = `<div class="empty">Loading…</div>`;
    const o = await api("/api/doctor/overview");
    serverOffset = new Date(o.now) - Date.now();
    updateBadges(o.students, o.counts.tasks_open);
    const c = o.counts;
    const hour = new Date().getHours(); const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    $("view").innerHTML = `
      <div class="head"><div><h2 class="title">${greet}, ${esc(me.name)} 👋</h2><p class="lead">Here is how your students are doing.</p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#/tasks">📅 Set today's task</a><button class="btn alt" id="dAdd">＋ Add student</button></div></div>
      <div class="grid kpis">
        <a class="card kpi" href="#/students"><div class="n">${c.students}</div><div class="l">students · ${c.active} active${c.pending ? ` · ${c.pending} pending` : ""}</div></a>
        <a class="card kpi" href="#/tasks"><div class="n">${c.tasks_open}</div><div class="l">open task${c.tasks_open === 1 ? "" : "s"} today</div></a>
        <div class="card kpi"><div class="n">${c.mastered_total}<small> / ${c.possible_total}</small></div><div class="l">items mastered, all students</div></div>
        <div class="card kpi"><div class="n" style="color:${c.deep_pending ? "var(--bad)" : "inherit"}">🧠 ${c.deep_pending}</div><div class="l">deep-training items pending</div></div>
        <a class="card kpi" href="#/videos"><div class="n">🎬 ${c.videos}</div><div class="l">video lesson${c.videos === 1 ? "" : "s"}${c.videos ? ` · ${c.videos_done} / ${c.videos_possible} watched` : ""}</div></a>
      </div>
      <div class="grid two">
        <div>
          <div class="section" style="margin-top:0"><h3>📅 Today's tasks</h3>
            ${o.tasks.length ? o.tasks.map((t) => `
              <a class="card task" href="#/tasks" style="margin-bottom:12px">
                <div><span class="kind">${esc(t.kind_name)}</span> ${levelPill(t.level)}<div class="word tam ${t.tamil.split(/\s+/).length >= 4 ? "long" : ""}">${esc(t.tamil)}</div><div class="rom">${esc(t.roman)}</div></div>
                <div><div class="due">⏳ <b class="tl ${timeLeft(t.due_at).soon ? "soon" : ""}" data-due="${t.due_at}">${timeLeft(t.due_at).text}</b> · due ${fmtDate(t.due_at)}</div>
                  <div class="track"><i style="width:${t.students ? Math.round(t.done / t.students * 100) : 0}%"></i></div>
                  <div class="due"><b>${t.done}</b> of ${t.students} students done</div></div>
                <div></div>
              </a>`).join("")
            : `<div class="card"><div class="empty">No task set for today yet. <a href="#/tasks" style="color:var(--brand)">Set one →</a></div></div>`}
          </div>
          <div class="section"><h3>🧒 Students</h3>
            <div class="card list">
              ${o.students.length ? o.students.map((s) => `
                <a class="li" href="#/students/${s.id}">${avatar(s, "sm")}<div><b>${esc(s.name)}</b><div class="muted">${s.status === "pending" ? "⏳ invite pending" : `${s.summary.mastered} / ${s.summary.total} mastered · active ${fmtAgo(s.summary.last_active)}`}</div></div>
                  <div class="r">${s.summary.deep_pending ? `<span class="pill bad">🧠 ${s.summary.deep_pending}</span> ` : ""}${s.summary.tasks_open ? `<span class="pill ${s.summary.tasks_done >= s.summary.tasks_open ? "ok" : "warn"}">task ${s.summary.tasks_done}/${s.summary.tasks_open}</span>` : ""}</div></a>`).join("")
              : `<div class="empty">No students yet. Add your first student to send them an account link.</div>`}
            </div>
          </div>
        </div>
        <div class="section" style="margin-top:0"><h3>⚡ Recent activity</h3>
          <div class="card list">
            ${o.activity.length ? o.activity.map((a) => `
              <a class="li" href="#/students/${a.student_id}">${avatar(a, "sm")}<div><b>${esc(a.student)}</b> <span class="muted">${a.source === "task" ? "did today's task" : a.source === "deep" ? "deep-trained" : a.source === "arcade" ? "played in the arcade" : "practised"}</span>
                <div><span class="tam" style="font-size:17px">${esc(a.tamil)}</span> <span class="muted">${VERDICT[a.verdict]?.face || ""} ${a.score}%</span></div></div>
                <div class="r muted">${fmtAgo(a.at)}</div></a>`).join("")
            : `<div class="empty">Nothing yet — activity appears as students practise.</div>`}
          </div>
        </div>
      </div>`;
    $("dAdd").onclick = openAddStudent;
    startTicks();
  }
  function startTicks() {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => { for (const el of document.querySelectorAll(".tl[data-due]")) { const t = timeLeft(el.dataset.due); el.textContent = t.text; el.classList.toggle("soon", t.soon); } }, 1000);
  }

  /* =========================================================
     students
     ========================================================= */
  async function viewStudents(r) {
    if (r.a) return viewStudent(Number(r.a));
    setCrumbs([{ label: "Dashboard", href: "#/dashboard" }, { label: "Students" }]);
    $("view").innerHTML = `<div class="empty">Loading…</div>`;
    const { students, now: n } = await api("/api/doctor/students");
    serverOffset = new Date(n) - Date.now();
    updateBadges(students, null);
    $("view").innerHTML = `
      <div class="head"><div><h2 class="title">Students 🧒</h2><p class="lead">${students.length} student${students.length === 1 ? "" : "s"}. Tap a card to see progress.</p></div>
        <button class="btn" id="addBtn">＋ Add new student</button></div>
      <div class="grid students" id="studentGrid">
        ${students.map(studentCard).join("")}
        <div class="card add-card" id="addCard"><div><div class="plus">＋</div>Add new student</div></div>
      </div>`;
    $("addBtn").onclick = openAddStudent; $("addCard").onclick = openAddStudent;
    bindStudentCards();
  }
  function studentCard(s) {
    const name = s.name; const pr = s.summary;
    return `
      <div class="card student" data-id="${s.id}" style="--av:${avColor(name)}">
        <div class="top"></div>
        <button class="del" data-del="${s.id}" data-name="${esc(name)}" title="Delete student">🗑</button>
        <div class="body">
          ${avatar(s)}
          <h3>${esc(name)}</h3>
          <div class="meta"><span>${genderIcon(s.gender)} ${genderLabel(s.gender)}</span><span>·</span><span>${s.age} yrs</span></div>
          <div class="meta" style="margin-top:4px"><span title="${esc(s.email)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">✉️ ${esc(s.email)}</span></div>
          <div class="foot">
            ${s.status === "pending" ? `<span class="pill warn">⏳ Invite pending</span>` : `<span class="pill ok">✓ Active</span>`}
            <div class="ring" style="--c:var(--brand);--p:${pr.pct}" title="${pr.mastered} of ${pr.total} mastered"><span>${pr.pct}%</span></div>
          </div>
          ${pr.deep_pending ? `<div style="margin-top:10px"><span class="pill bad">🧠 ${pr.deep_pending} in deep training</span></div>` : ""}
        </div>
      </div>`;
  }
  function bindStudentCards() {
    for (const el of document.querySelectorAll(".student")) el.onclick = (e) => { if (!e.target.closest(".del")) location.hash = `#/students/${el.dataset.id}`; };
    for (const b of document.querySelectorAll(".del[data-del]")) b.onclick = (e) => { e.stopPropagation(); deleteStudent(Number(b.dataset.del), b.dataset.name); };
  }
  async function deleteStudent(id, name, after) {
    const ok = await confirmModal({ title: `Delete ${name}?`, body: `This removes the student, their account, all progress and task results. <b>This cannot be undone.</b>` });
    if (!ok) return;
    try { await api(`/api/doctor/students/${id}`, { method: "DELETE" }); toast(`${name} deleted`, "ok"); if (after) after(); else render(); }
    catch (err) { toast(err.message, "bad"); }
  }

  function openAddStudent() {
    openModal(`
      <h3>Add new student</h3><p class="sub">They will get an email with a link to create their account.</p>
      <div class="err" id="mErr"></div>
      <form class="form" id="addForm">
        <div class="photo-pick">
          <div class="avatar" id="pvAvatar" style="--av:var(--brand)" title="Choose a photo">📷</div>

  function showInviteResult(s, invite, created) {

            <div class="r">${r.status === "done" ? `<span class="pill ok">✓ Watched · ${fmtAgo(r.completed_at)}</span>` : r.status === "started" ? `<span class="pill warn">▶ ${r.watched_pct}% watched</span>` : `<span class="pill">⏳ Not watched</span>`}</div></div>`; }).join("")

          <div class="grid items ${m.wide ? "wide" : ""}">${c.items.map((e) => `

              <div class="big tam">${esc(e.tamil)}</div><div class="rom">${esc(e.roman)}</div>
              ${starHtml(e.best_stars)}<div class="n">${e.attempts ? `best ${e.best_score}% · ${e.attempts}×` : "not tried"}</div>

  /* =========================================================
     tasks
     ========================================================= */
  let taskMode = "pick";
  async function viewTasks() {
    setCrumbs([{ label: "Dashboard", href: "#/dashboard" }, { label: "Today's Task" }]);
    $("view").innerHTML = `<div class="empty">Loading…</div>`;
    const t = await api("/api/doctor/tasks");
    serverOffset = new Date(t.now) - Date.now();
    updateBadges(null, t.active.length);
    const eod = new Date(); eod.setHours(23, 59, 0, 0);
    const dateVal = `${eod.getFullYear()}-${String(eod.getMonth() + 1).padStart(2, "0")}-${String(eod.getDate()).padStart(2, "0")}`;
    $("view").innerHTML = `
      <div class="head"><div><h2 class="title">Today's Task 📅</h2><p class="lead">Set a vowel, word or sentence for every student to practise before the deadline.</p></div></div>
      <div class="grid two">
        <div class="card">
          <h3 style="margin:0 0 4px;font-size:19px;font-weight:900">New task for all students</h3>
          <p class="sub" style="color:var(--muted);font-weight:700;margin:0 0 14px">Goes to every active student the moment you broadcast it.</p>
          <div class="err" id="tErr"></div>
          <form class="form" id="taskForm">
            <label class="f">Type
              <div class="seg" id="kindSeg">${CAT_ORDER.map((k, i) => `<button type="button" data-kind="${k}" class="${i === 1 ? "active" : ""}">${CATS[k].emoji} ${CATS[k].short}${CATS[k].level ? ` · ${LEVELS[CATS[k].level].name}` : ""}</button>`).join("")}</div></label>
            <label class="f">Level
              <div class="seg" id="levelSeg">${Object.entries(LEVELS).map(([k, l]) => `<button type="button" data-level="${k}" class="${k === "easy" ? "active" : ""}">${l.emoji} ${l.name}</button>`).join("")}</div>
              <span style="font-weight:700;font-size:12px" id="levelHint">Words are easy, short sentences medium, sentences hard — change it if this one is different.</span></label>
            <div class="seg" id="modeSeg" style="align-self:flex-start"><button type="button" data-mode="pick" class="active">Pick from the lesson list</button><button type="button" data-mode="custom">Type custom Tamil</button></div>
            <div id="pickPane"><label class="f">Item <select class="in" id="tEntry"></select></label></div>
            <div id="customPane" class="hidden">
              <div class="row"><label class="f">Tamil text <input class="in tam" id="tText" placeholder="e.g. நல்ல நாள்" maxlength="200" /></label><label class="f">In English letters (optional) <input class="in" id="tRoman" placeholder="filled in automatically if empty" /></label></div>
              <label class="f" style="margin-top:12px">Meaning (optional) <input class="in" id="tMeaning" placeholder="e.g. good day" /></label>
            </div>
            <div class="preview" id="tPreview"></div>
            <div class="row"><label class="f">Finish by (date) <input class="in" id="tDate" type="date" value="${dateVal}" required /></label><label class="f">Time <input class="in" id="tTime" type="time" value="23:59" required /></label></div>
            <label class="f">Note to students (optional) <input class="in" id="tNote" maxlength="200" placeholder="e.g. Say it slowly three times" /></label>
            <div class="actions" style="justify-content:space-between;align-items:center">
              <span style="color:var(--muted);font-weight:700;font-size:13px" id="tCount"></span>
              <button class="btn big" type="submit" id="tSave">📣 Broadcast to all students</button></div>
          </form>
        </div>
        <div>
          <div class="tabs"><button class="active" id="tabActive">Open (${t.active.length})</button><button id="tabPast">Past (${t.past.length})</button></div>
          <div id="taskList"></div>
        </div>
      </div>`;
    let kind = "words", level = "easy";
    const setLevel = (lv) => { level = lv; for (const x of document.querySelectorAll("#levelSeg button")) x.classList.toggle("active", x.dataset.level === lv); };
    const fillEntries = () => { $("tEntry").innerHTML = (lexicon[kind] || []).map((e) => `<option value="${e.id}">${esc(e.tamil)} — ${esc(e.roman)}${kind === "vowels" ? "" : ` (${esc(e.meaning)})`}</option>`).join(""); preview(); };
    const preview = () => {
      let tamil, roman, meaning;
      if (taskMode === "pick") { const e = byId[$("tEntry").value]; if (!e) { $("tPreview").innerHTML = ""; return; } ({ tamil, roman, meaning } = e); }
      else { tamil = $("tText").value.trim(); roman = $("tRoman").value.trim(); meaning = $("tMeaning").value.trim(); }
      $("tPreview").innerHTML = tamil ? `<div class="word tam">${esc(tamil)}</div><div class="rom">${esc(roman) || "&nbsp;"}</div>${meaning ? `<div class="rom" style="font-weight:700">“${esc(meaning)}”</div>` : ""}` : `<div class="rom">Type the Tamil text above</div>`;
    };
    for (const b of document.querySelectorAll("#kindSeg button")) b.onclick = () => { for (const x of b.parentNode.children) x.classList.remove("active"); b.classList.add("active"); kind = b.dataset.kind; setLevel(CATS[kind].level || "easy"); fillEntries(); };
    for (const b of document.querySelectorAll("#levelSeg button")) b.onclick = () => setLevel(b.dataset.level);
    for (const b of document.querySelectorAll("#modeSeg button")) b.onclick = () => { for (const x of b.parentNode.children) x.classList.remove("active"); b.classList.add("active"); taskMode = b.dataset.mode; $("pickPane").classList.toggle("hidden", taskMode !== "pick"); $("customPane").classList.toggle("hidden", taskMode !== "custom"); preview(); };
    $("tEntry").onchange = preview; for (const id of ["tText", "tRoman", "tMeaning"]) $(id).oninput = preview;
    fillEntries();
    $("tCount").textContent = `${t.active_students} active student${t.active_students === 1 ? "" : "s"}` +
      (t.pending_students ? ` · ${t.pending_students} still ${t.pending_students === 1 ? "has" : "have"} to create an account and will not see it` : "");

    $("taskForm").onsubmit = async (e) => {
      e.preventDefault(); $("tErr").classList.remove("show"); $("tSave").disabled = true;
      const due = new Date(`${$("tDate").value}T${$("tTime").value}:00`);
      const body = { kind, level, due_at: due.toISOString(), note: $("tNote").value.trim() };
      if (taskMode === "pick") body.entry_id = $("tEntry").value; else { body.text = $("tText").value.trim(); body.roman = $("tRoman").value.trim(); body.meaning = $("tMeaning").value.trim(); }
      try { await api("/api/doctor/tasks", { method: "POST", json: body }); toast("Task broadcast to all students 📣", "ok"); viewTasks(); }
      catch (err) { $("tErr").textContent = err.message; $("tErr").classList.add("show"); $("tSave").disabled = false; }
    };

    const renderList = (list, past) => {
      $("taskList").innerHTML = list.length ? list.map((tk) => taskCard(tk, past)).join("") : `<div class="card"><div class="empty">${past ? "No past tasks yet." : "No open task. Create one on the left — every student sees it with a countdown."}</div></div>`;
      for (const b of document.querySelectorAll("[data-deltask]")) b.onclick = async () => {
        if (!(await confirmModal({ title: "Delete this task?", body: "Students will no longer see it and their results for it are removed." }))) return;
        try { await api(`/api/doctor/tasks/${b.dataset.deltask}`, { method: "DELETE" }); toast("Task deleted", "ok"); viewTasks(); } catch (err) { toast(err.message, "bad"); }
      };
      startTicks();
    };
    $("tabActive").onclick = () => { $("tabActive").classList.add("active"); $("tabPast").classList.remove("active"); renderList(t.active, false); };
    $("tabPast").onclick = () => { $("tabPast").classList.add("active"); $("tabActive").classList.remove("active"); renderList(t.past, true); };
    renderList(t.active, false);
  }
  function taskCard(t, past) {
    const pct = t.students ? Math.round(t.counts.done / t.students * 100) : 0; const tl = timeLeft(t.due_at);
    const chip = (r) => { const v = VERDICT[r.best_verdict]; const cls = r.status === "done" ? "ok" : r.status === "attempted" ? "warn" : past ? "bad" : "";
      return `<a class="pill ${cls}" href="#/students/${r.student_id}" title="${r.attempts ? `${r.attempts} attempt${r.attempts === 1 ? "" : "s"} · best ${r.best_score}%` : "not started"}">${avatar(r, "sm")} ${esc(r.name.split(" ")[0])} ${r.status === "done" ? "✓" : r.status === "attempted" ? (v?.face || "…") : past ? "✗" : "⏳"}</a>`; };
    return `
      <div class="card task" style="margin-bottom:12px">
        <div><span class="kind">${esc(t.kind_name)}</span> ${levelPill(t.level)}<div class="word tam ${t.tamil.split(/\s+/).length >= 4 ? "long" : ""}">${esc(t.tamil)}</div><div class="rom">${esc(t.roman)}${t.meaning ? ` · “${esc(t.meaning)}”` : ""}</div>${t.note ? `<div class="rom" style="font-weight:700;margin-top:4px">📝 ${esc(t.note)}</div>` : ""}</div>
        <div>
          <div class="due">${past ? `Closed ${fmtDate(t.due_at)}` : `⏳ <b class="tl ${tl.soon ? "soon" : ""}" data-due="${t.due_at}">${tl.text}</b> · due ${fmtDate(t.due_at)}`}</div>
          <div class="track"><i style="width:${pct}%"></i></div>
          <div class="due"><b>${t.counts.done}</b> done · ${t.counts.attempted} tried · ${t.counts.pending} ${past ? "missed" : "waiting"} of ${t.students}</div>
          <div class="who">${t.results.map(chip).join("") || `<span class="empty">No active students yet</span>`}</div>
        </div>
        <div class="side"><button class="btn ghost-danger sm" data-deltask="${t.id}">🗑</button></div>
      </div>`;
  }

      <div class="head"><div><h2 class="title">Video Lessons 🎬</h2><p class="lead">Upload a recorded lesson and every student can watch it. You will see who has finished.</p></div></div>
      <div class="card" style="margin-bottom:22px">
        <h3 style="margin:0 0 4px;font-size:19px;font-weight:900">Upload a new lesson</h3>
        <p class="sub" style="color:var(--muted);font-weight:700;margin:0 0 14px">Goes to every active student the moment it is uploaded.
          ${d.active_students} active student${d.active_students === 1 ? "" : "s"}${d.pending_students ? ` · ${d.pending_students} still ${d.pending_students === 1 ? "has" : "have"} to create an account` : ""}.</p>
        <div class="err" id="vErr"></div>
        <form class="form" id="vForm">
          <div class="row" style="grid-template-columns:1fr 1fr">
            <div class="form">
              <label class="f">Title <input class="in" id="vTitle" required maxlength="120" placeholder="e.g. How to say the 12 vowels" /></label>
              <label class="f">Description (optional) <textarea class="in" id="vDesc" maxlength="1000" placeholder="What the child should watch for"></textarea></label>
            </div>
            <div class="form">
              <label class="f">Video file
                <div class="drop" id="vDrop"><div class="big">🎬</div><div id="vDropText">Drop a video here or click to choose</div><div style="font-size:12px;margin-top:4px">MP4, WebM, OGV or MOV · up to ${d.max_video_mb} MB</div></div>
                <input type="file" id="vFile" accept="video/mp4,video/webm,video/ogg,video/quicktime,.mp4,.m4v,.webm,.ogv,.mov" class="hidden" /></label>
              <div id="vProg" class="hidden"><div class="upbar"><i id="vBar"></i></div><div style="color:var(--muted);font-weight:800;font-size:13px;margin-top:6px" id="vProgText">Uploading…</div></div>
            </div>
          </div>
          <div class="actions" style="justify-content:flex-end"><button class="btn big" type="submit" id="vSave">📤 Upload &amp; share with all students</button></div>
        </form>
      </div>
      <div class="section" style="margin-top:0"><h3>📚 Lessons <span class="pill">${d.videos.length}</span></h3>
        ${d.videos.length ? `<div class="grid videos" id="videoGrid">${d.videos.map(videoCard).join("")}</div>`
                          : `<div class="card"><div class="empty">No video lessons yet. Upload the first one above — every student will see it under Video Lessons.</div></div>`}
      </div>`;
    let picked = null, pickedDuration = null;
    const setFile = async (f) => {
      if (!f) return;
      picked = f; pickedDuration = null;
      $("vDrop").classList.add("has"); $("vDropText").textContent = `${f.name} · ${fmtSize(f.size)}`;
      if (!$("vTitle").value.trim()) $("vTitle").value = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ");
      pickedDuration = await probeDuration(f);
      if (pickedDuration) $("vDropText").textContent = `${f.name} · ${fmtSize(f.size)} · ${fmtDur(pickedDuration)}`;
    };
    $("vDrop").onclick = () => $("vFile").click();
    $("vFile").onchange = () => setFile($("vFile").files[0]);
    $("vDrop").ondragover = (e) => { e.preventDefault(); $("vDrop").classList.add("over"); };
    $("vDrop").ondragleave = () => $("vDrop").classList.remove("over");
    $("vDrop").ondrop = (e) => { e.preventDefault(); $("vDrop").classList.remove("over"); setFile(e.dataTransfer.files[0]); };
    $("vForm").onsubmit = async (e) => {
      e.preventDefault(); $("vErr").classList.remove("show");
      if (!picked) { $("vErr").textContent = "Choose a video file first."; $("vErr").classList.add("show"); return; }
      $("vSave").disabled = true; $("vProg").classList.remove("hidden"); $("vBar").style.width = "0%";
      const form = new FormData();
      form.append("title", $("vTitle").value.trim()); form.append("description", $("vDesc").value.trim());
      if (pickedDuration) form.append("duration", String(pickedDuration));
      form.append("file", picked, picked.name);
      try {
        await upload("/api/doctor/videos", form, (p) => { $("vBar").style.width = `${Math.round(p * 100)}%`; $("vProgText").textContent = p >= 1 ? "Saving…" : `Uploading… ${Math.round(p * 100)}%`; });
        toast("Lesson shared with all students 🎬", "ok"); viewVideos();
      } catch (err) { $("vErr").textContent = err.message; $("vErr").classList.add("show"); $("vSave").disabled = false; $("vProg").classList.add("hidden"); }
    };
    bindVideoCards(d.videos);
  }
  function videoCard(v) {
    const pct = v.students ? Math.round(v.counts.done / v.students * 100) : 0;
    const chip = (r) => `<a class="pill ${r.status === "done" ? "ok" : r.status === "started" ? "warn" : ""}" href="#/students/${r.student_id}" title="${r.status === "done" ? `finished ${fmtAgo(r.completed_at)}` : r.status === "started" ? `watched ${r.watched_pct}%` : "not watched yet"}">${avatar(r, "sm")} ${esc(r.name.split(" ")[0])} ${r.status === "done" ? "✓" : r.status === "started" ? `${r.watched_pct}%` : "⏳"}</a>`;
    return `
      <div class="card vcard" data-vid="${v.id}">
        <div class="vthumb" data-play="${v.id}"><video preload="metadata" muted src="${esc(videoSrc(v))}#t=0.5"></video><div class="play">▶</div>${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ""}</div>
        <div class="vbody">
          <h3>${esc(v.title)}</h3>
          ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ""}
          <div class="meta"><span>${fmtSize(v.size_bytes)}</span><span>·</span><span>uploaded ${fmtDate(v.created_at)}</span></div>
          <div class="track" style="margin-top:6px"><i style="width:${pct}%"></i></div>
          <div class="meta"><b style="color:var(--text)">${v.counts.done}</b> of ${v.students} student${v.students === 1 ? "" : "s"} finished watching${v.counts.started ? ` · ${v.counts.started} part-way` : ""}</div>
          <div class="who">${v.results.map(chip).join("") || `<span class="empty" style="padding:0">No active students yet</span>`}</div>
          <div class="foot"><button class="btn sm" data-play="${v.id}">▶ Play</button><button class="btn ghost-danger sm" data-delvideo="${v.id}" data-title="${esc(v.title)}">🗑 Delete</button></div>
        </div>
      </div>`;
  }
  function bindVideoCards(videos) {
    const byId = Object.fromEntries(videos.map((v) => [v.id, v]));
    for (const el of document.querySelectorAll("[data-play]")) el.onclick = () => openPlayer(byId[el.dataset.play]);
    for (const b of document.querySelectorAll("[data-delvideo]")) b.onclick = async () => {
      if (!(await confirmModal({ title: `Delete “${b.dataset.title}”?`, body: "Students will no longer see this lesson and the record of who watched it is removed. <b>The file is deleted from the server.</b>" }))) return;
      try { await api(`/api/doctor/videos/${b.dataset.delvideo}`, { method: "DELETE" }); toast("Lesson deleted", "ok"); viewVideos(); } catch (err) { toast(err.message, "bad"); }
    };
  }

  /* =========================================================
     settings
     ========================================================= */
  async function viewSettings() {
    setCrumbs([{ label: "Dashboard", href: "#/dashboard" }, { label: "Settings" }]);
    const h = await fetch("/health").then((r) => r.json()).catch(() => ({}));
    $("view").innerHTML = `
      <h2 class="title">Settings ⚙️</h2><p class="lead">Your account, appearance, and how the portal is wired up.</p>
      <div class="grid cats">
        <div class="card"><h3 style="margin:0 0 8px">Change password</h3>
          <div class="err" id="pErr"></div>
          <form class="form" id="pwForm">
            <label class="f">Current password <input class="in" id="pwCur" type="password" autocomplete="current-password" required /></label>
            <label class="f">New password <input class="in" id="pwNew" type="password" autocomplete="new-password" required minlength="6" /></label>
            <label class="f">Confirm new password <input class="in" id="pwNew2" type="password" autocomplete="new-password" required /></label>
            <button class="btn" type="submit" id="pwBtn" style="justify-self:start">Update password</button>
          </form></div>
        <div class="card"><h3 style="margin:0 0 8px">Appearance</h3><p style="color:var(--muted);font-weight:700;margin:0 0 12px">Light is the default for the clinic; dark is easier at night.</p><button class="btn alt" id="sTheme">Toggle theme</button></div>
        <div class="card"><h3 style="margin:0 0 8px">This server</h3>
          <div style="font-weight:700;color:var(--muted);line-height:1.9">
            address in invite links: <b style="color:var(--text)">${esc(h.public_url || "–")}</b><br>
            speech model: <b style="color:${h.model_loaded ? "var(--ok)" : "var(--warn)"}">${h.model_loaded ? "ready" : h.load_error ? "unavailable" : "warming up"}</b><br>
            invite email: <b style="color:${h.email_configured ? "var(--ok)" : "var(--warn)"}">${h.email_configured ? "configured" : "not configured — links are shown to copy"}</b>
          </div>
          <p style="color:var(--muted);font-weight:700;font-size:13px;margin:10px 0 0">Set SMTP_* and PUBLIC_URL in <code>.env</code>, then restart. Children sign in on the same page as you, as “Child”.</p></div>
      </div>`;
    $("sTheme").onclick = () => $("themeBtn").click();
    $("pwForm").onsubmit = async (e) => {
      e.preventDefault(); $("pErr").classList.remove("show");
      if ($("pwNew").value !== $("pwNew2").value) { $("pErr").textContent = "The new passwords do not match."; $("pErr").classList.add("show"); return; }
      $("pwBtn").disabled = true;
      try {
        const res = await api("/api/doctor/password", { method: "POST", json: { current_password: $("pwCur").value, new_password: $("pwNew").value } });
        if (res.token) setToken(res.token);   // the old token is retired: other devices are signed out
        toast("Password updated", "ok"); $("pwForm").reset();
      }
      catch (err) { $("pErr").textContent = err.message; $("pErr").classList.add("show"); }
      finally { $("pwBtn").disabled = false; }
    };
  }

  boot();
})();
</script>
</body>
</html>
