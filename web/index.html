    $("fileInput").onchange = (e) => { if (e.target.files[0]) acceptFile(e.target.files[0]); };
    $("tMic").onclick = () => toggleRec("transcribe");
    $("goBtn").onclick = transcribe;
    $("clearBtn").onclick = () => { pending = null; $("filePane").classList.remove("show"); $("out").classList.remove("show"); $("fileInput").value = ""; };
    $("copyBtn").onclick = async () => { await navigator.clipboard.writeText($("text").textContent + "\n" + $("textRoman").textContent); $("copyBtn").textContent = "Copied ✓"; setTimeout(() => ($("copyBtn").textContent = "Copy"), 1400); };
    $("dlBtn").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("text").textContent + "\n\n" + $("textRoman").textContent + "\n"], { type: "text/plain;charset=utf-8" })); a.download = `transcript-${stamp()}.txt`; a.click(); URL.revokeObjectURL(a.href); };
  }
  async function acceptFile(file) { hideError(); let s = null; try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); s = (await ctx.decodeAudioData(await file.arrayBuffer())).duration; ctx.close(); } catch {} setPending(file, file.name, s); }
  function setPending(blob, name, seconds) {
    pending = { blob, name, seconds };
    if (!$("filePane")) return;
    $("fileName").textContent = name; $("fileMeta").textContent = (seconds ? fmtTime(seconds) + " · " : "") + (blob.size / 1048576).toFixed(2) + " MB";
    $("player").src = URL.createObjectURL(blob); $("filePane").classList.add("show");
  }
  async function transcribe() {
    if (!pending) return; hideError();
    $("goBtn").disabled = true; $("bar").classList.add("show");
    const form = new FormData(); form.append("file", pending.blob, pending.name);
    try {
      const res = await fetch("/transcribe", { method: "POST", body: form });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
      $("text").textContent = body.text || "No speech was detected."; $("textRoman").textContent = body.roman || "";
      $("mDur").textContent = fmtTime(body.duration_sec); $("mEl").textContent = body.elapsed_sec.toFixed(1) + "s"; $("mRtf").textContent = (1 / Math.max(body.real_time_factor, 0.001)).toFixed(1) + "× real-time";
      $("out").classList.add("show");
    } catch (e) { showError(e.message || "Transcription failed."); }
    finally { $("goBtn").disabled = false; $("bar").classList.remove("show"); const h = $("tHint"); if (h) h.textContent = "Tap to start"; }
  }

  /* =========================================================
     delight
     ========================================================= */
  function confetti() {
    const box = $("confetti"); const colors = ["#7c6cff", "#5be0d8", "#ffc857", "#ff6b8a", "#38d996"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw"; p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * .4 + "s"; p.style.animationDuration = 1.2 + Math.random() * .9 + "s";
      box.append(p); setTimeout(() => p.remove(), 2400);
    }
  }
  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [[523, 0], [659, .12], [784, .24]].forEach(([f, t]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.type = "sine"; g.gain.value = 0.0001;
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + .35);
        o.stop(ctx.currentTime + t + .4);
      });
      setTimeout(() => ctx.close(), 900);
    } catch {}
  }

  /* ---------- helpers ---------- */
  function fmtTime(s) { s = Math.max(0, s || 0); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`; }
  function stamp() { return new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19); }

  // in the way the recorder does, without a microphone.
  if (new URLSearchParams(location.search).has("debug")) {
